[project]
name        = "pianola"
description = "🎹 Smoothest piano roll visualizer"
version     = "0.10.0"
license     = "AGPL-3.0"
readme      = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "cyclopts",
    "dearlog",
    "platformdirs",
    "pooch~=1.0",
    "shaderflow",
]

[project.urls]
GitHub = "https://github.com/BrokenSource/Pianola"

[project.scripts]
pianola = "pianola.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
